          foreach ($file in 'settings.gradle.kts', 'build.gradle.kts') {
            $kept = Get-Content $file | Where-Object { $_ -notmatch 'maven\.aliyun\.com' }
            Set-Content -Path $file -Value $kept -Encoding utf8
            Write-Host "$file : aliyun mirrors removed"
          }

      - name: Build
        run: |
          ./gradlew desktopApp:packageDistributionForCurrentOS
          DMG_PATH=$(find ./desktopApp/build/compose/binaries/main/dmg -name "*.dmg")
          NEW_DMG_PATH=$(echo $DMG_PATH | sed 's/Kanji dojo CC/Kanji dojo CC-intel/g')
          mv "$DMG_PATH" "$NEW_DMG_PATH"

      - name: Upload Desktop Build
        uses: actions/upload-artifact@v5
        with:
          name: mac-intel
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          retention-days: 1


