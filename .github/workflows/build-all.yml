name: Build All

on: [ workflow_call, workflow_dispatch ]

jobs:
  # The installers are useless without the VOICEVOX runtime (TTS would silently fall back to the
  # system voice), and it is not in the repository, so it is assembled once here and handed to every
  # platform build. Everything comes from official releases - see tools/voicevox/fetch-runtime.ps1.
  voicevox-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assemble the VOICEVOX runtime
        shell: pwsh
        run: |
          Write-Host "pwsh $($PSVersionTable.PSVersion) / $($PSVersionTable.OS)"
          Write-Host "python  : $((Get-Command python -ErrorAction SilentlyContinue).Source)"
          Write-Host "python3 : $((Get-Command python3 -ErrorAction SilentlyContinue).Source)"
          try {
            ./tools/voicevox/fetch-runtime.ps1
          } catch {
            # Surface the reason in the run's annotation panel as well, not only in the job log.
            Write-Host "::error::fetch-runtime failed: $($_.Exception.Message)"
            Write-Host $_.ScriptStackTrace
            exit 1
          }

      # A silent gap here is exactly the failure mode this job exists to prevent: the installers
      # would build fine and quietly ship without the TTS engine.
      - name: Verify the runtime is complete
        shell: pwsh
        run: |
          $required = @(
            'tools/voicevox/runtime/core/dict/open_jtalk_dic_utf_8-1.11/sys.dic',
            'tools/voicevox/runtime/models/4.vvm',
            'tools/voicevox/runtime/core/onnxruntime/lib/windows-x64/voicevox_onnxruntime.dll',
            'tools/voicevox/runtime/core/onnxruntime/lib/linux-x64/libvoicevox_onnxruntime.so',
            'tools/voicevox/runtime/core/onnxruntime/lib/linux-arm64/libvoicevox_onnxruntime.so',
            'tools/voicevox/runtime/core/onnxruntime/lib/macos-x64/libvoicevox_onnxruntime.dylib',
            'tools/voicevox/runtime/core/onnxruntime/lib/macos-arm64/libvoicevox_onnxruntime.dylib',
            'tools/voicevox/runtime/android/jniLibs/arm64-v8a/libvoicevox_core_java_api.so',
            'tools/voicevox/runtime/android/jniLibs/arm64-v8a/libvoicevox_onnxruntime.so',
            'tools/voicevox/runtime/android/jniLibs/x86_64/libvoicevox_core_java_api.so',
            'tools/voicevox/runtime/android/jniLibs/x86_64/libvoicevox_onnxruntime.so'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "missing: $_" }
            throw 'The VOICEVOX runtime is incomplete - refusing to build installers without TTS.'
          }
          Write-Host 'VOICEVOX runtime looks complete'

      - name: Upload runtime
        uses: actions/upload-artifact@v5
        with:
          name: voicevox-runtime
          path: tools/voicevox/runtime
          retention-days: 1

  build-android-and-desktop-linux:
    needs: voicevox-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup build environment
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download runtime
        uses: actions/download-artifact@v6
        with:
          name: voicevox-runtime
          path: tools/voicevox/runtime

      # The runners are not in China: the project's aliyun mirrors only slow the resolution down,
      # and resolving against them is what made these jobs fail. Stripping them here keeps local
      # builds untouched while CI resolves from the official repositories.
      # Uploading a directory puts its *contents* in the artifact (core/, models/, android/), so
      # this is what restores tools/voicevox/runtime in full.
      - name: Verify the runtime is in place
        shell: pwsh
        run: |
          if (-not (Test-Path 'tools/voicevox/runtime/models/4.vvm')) {
            Write-Host "::error::the runtime artifact did not extract to tools/voicevox/runtime"
            Get-ChildItem -Recurse -Depth 4 -Filter '*.vvm' . | Select-Object -First 5 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host 'VOICEVOX runtime is where the build expects it'

      - name: Use the official Gradle repositories
        shell: pwsh
        run: |
          foreach ($file in 'settings.gradle.kts', 'build.gradle.kts') {
            $kept = Get-Content $file | Where-Object { $_ -notmatch 'maven\.aliyun\.com' }
            Set-Content -Path $file -Value $kept -Encoding utf8
            Write-Host "$file : aliyun mirrors removed"
          }

      # Fail in a second instead of after eight minutes of compiling. Only checks that the secrets
      # exist - whether they actually fit the keystore is checked in the Build step below, after the
      # keystore has been placed (that ordering is what a previous run got wrong).
      - name: Check the Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "value=\$$name"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::release signing secrets are missing:$missing (repository Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          echo "signing secrets present"

      - name: Build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          # Only overwrite the keystore when the secret actually carries one: an empty secret used
          # to decode to a zero-byte keystore.jks and clobber the one committed in the repository.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore.jks
            echo "keystore.jks restored from ANDROID_KEYSTORE_BASE64"
          else
            echo "using the keystore.jks committed in the repository"
          fi

          # Verify the file we are about to sign with, whichever way it got here. This has to run
          # *after* the overwrite above - checking before it only ever proves the repository copy is
          # fine, while the build uses whatever the secret left behind.
          # keytool prints the alias and certificate but never the password (-storepass:env keeps it
          # off the command line and out of the log).
          sha256sum keystore.jks || true
          if ! keytool -list -keystore keystore.jks -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS"; then
            echo "::error::keystore.jks cannot be opened with ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS - if you set ANDROID_KEYSTORE_BASE64, its value is not this keystore"
            exit 1
          fi
          echo "keystore alias '$ANDROID_KEY_ALIAS' verified"

          ./gradlew app:assembleFdroidRelease
          ./desktopApp/linux/AppImage/make.sh

      - name: Upload Android Build
        uses: actions/upload-artifact@v5
        with:
          name: android
          path: app/build/outputs/apk/fdroid/release/*.apk
          retention-days: 1

      - name: Upload Desktop Build
        uses: actions/upload-artifact@v5
        with:
          name: linux
          path: desktopApp/linux/AppImage/Kanji_dojo_CC-x86_64.AppImage
          retention-days: 1

